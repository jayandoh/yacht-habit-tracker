name: Claude Code

# Runs Claude when the repo owner adds the `claude` label to an issue,
# or mentions @claude in an issue/PR comment or review.

on:
    issues:
        types: [labeled]
    issue_comment:
        types: [created]
    pull_request_review_comment:
        types: [created]
    pull_request_review:
        types: [submitted]

concurrency:
    group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
    cancel-in-progress: false

jobs:
    claude:
        # Only the repo owner can trigger runs, so nobody else can spend the subscription.
        if: |
            github.actor == 'jayandoh' && (
              (github.event_name == 'issues' && github.event.label.name == 'claude') ||
              (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
              (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
              (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude'))
            )
        runs-on: ubuntu-latest
        timeout-minutes: 30
        permissions:
            contents: write
            pull-requests: write
            issues: write
            id-token: write
            actions: read # Lets Claude read CI results on PRs

        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 1

            - name: Use Node.js 20.x
              uses: actions/setup-node@v4
              with:
                  node-version: 20.x
                  cache: "npm"

            - run: npm ci

            - name: Run Claude Code
              uses: anthropics/claude-code-action@v1
              with:
                  claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
                  label_trigger: claude
                  trigger_phrase: "@claude"
                  # Produces e.g. 11-enhancement-let-the-user-set-the
                  branch_name_template: "{{entityNumber}}-{{label}}-{{description}}"
                  claude_args: |
                      --max-turns 30
                      --allowedTools "Bash(npm run build),Bash(npm run lint),Bash(gh pr create:*),Bash(gh pr list:*)"
                      --append-system-prompt "Repository conventions: Read AGENTS.md before changing code. Commit messages use the format '<issue#>-<feat|bug>: <summary>'. Run npm run build and npm run lint before committing; both must pass. Never commit main.js, data.json, or node_modules. When working on an issue, after pushing your commits open the pull request yourself with gh pr create --base main, using a body that starts with 'Closes #<issue#>', summarizes the changes, and lists manual test steps in Obsidian; then put the PR link in your comment instead of a 'Create a PR' link."
